$kind: http-request
name: "Admin: direct SALE movement is rejected"
url: "{{baseUrl}}/api/admin/inventory/accessories/{{matsId}}/movements"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "type": "SALE",
      "quantityDelta": -1,
      "note": "Must be generated by order"
    }
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: pm.test('Direct SALE is rejected', () => pm.expect(pm.response.code).to.be.oneOf([400,422]));
    language: text/javascript
order: 6000
