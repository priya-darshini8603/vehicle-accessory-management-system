$kind: http-request
name: "Admin: report rejects days above maximum"
url: "{{baseUrl}}/api/admin/inventory/report?days=366"
method: GET
queryParams:
  days: "366"
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: pm.test('days above maximum is rejected', () => pm.expect(pm.response.code).to.be.oneOf([400,422]));
    language: text/javascript
order: 14000
