$kind: http-request
name: "Admin: adjustment without reason is rejected"
url: "{{baseUrl}}/api/admin/inventory/accessories/{{matsId}}/movements"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "type": "ADJUSTMENT",
      "quantityDelta": 5,
      "note": " "
    }
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: pm.test('Missing adjustment reason is rejected', () => pm.expect(pm.response.code).to.be.oneOf([400,422]));
    language: text/javascript
order: 5000
