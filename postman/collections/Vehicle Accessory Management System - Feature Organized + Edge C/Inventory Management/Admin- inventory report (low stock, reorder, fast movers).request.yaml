$kind: http-request
name: "Admin: inventory report (low stock, reorder, fast movers)"
url: "{{baseUrl}}/api/admin/inventory/report?days={{inventoryReportDays}}"
method: GET
queryParams:
  days: "{{inventoryReportDays}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      const r = pm.response.json();
      pm.test('Mud flaps out of stock', () => pm.expect(r.outOfStockItems.map(i => i.name)).to.include('Mud Flaps'));
      pm.test('Roof rack low on stock', () => pm.expect(r.lowStockItems.map(i => i.name)).to.include('Roof Rack'));
      pm.test('Phone mount is a fast mover', () => pm.expect(r.fastMovingProducts.map(i => i.name)).to.include('Magnetic Phone Mount'));
    language: text/javascript
order: 2000
