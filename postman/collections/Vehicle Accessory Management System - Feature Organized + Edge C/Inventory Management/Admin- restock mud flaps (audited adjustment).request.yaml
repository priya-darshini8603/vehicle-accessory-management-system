$kind: http-request
name: "Admin: restock mud flaps (audited adjustment)"
url: "{{baseUrl}}/api/admin/inventory/accessories/{{mudFlapsId}}/movements"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "type": "ADJUSTMENT",
      "quantityDelta": {{stockAdjustmentQuantity}},
      "note": "{{stockAdjustmentReason}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      pm.test('Stock after = 20', () => pm.expect(pm.response.json().stockAfter).to.eql(20));
    language: text/javascript
order: 3000
