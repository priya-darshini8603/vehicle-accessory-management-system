$kind: http-request
name: "Admin: movement history start after end is rejected"
url: "{{baseUrl}}/api/admin/inventory/accessories/{{matsId}}/movements?from=2026-10-20T00:00:00Z&to=2026-10-01T00:00:00Z"
method: GET
queryParams:
  from: 2026-10-20T00:00:00Z
  to: 2026-10-01T00:00:00Z
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: pm.test('Invalid date range is rejected', () => pm.expect(pm.response.code).to.be.oneOf([400,422]));
    language: text/javascript
order: 10000
