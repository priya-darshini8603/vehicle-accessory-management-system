$kind: http-request
description: The role is re-read on every request, so the existing token picks up the new role immediately.
url: "{{baseUrl}}/api/admin/accessories"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{customerToken}}"
scripts:
  - type: afterResponse
    code: pm.test('Status is 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 3000
