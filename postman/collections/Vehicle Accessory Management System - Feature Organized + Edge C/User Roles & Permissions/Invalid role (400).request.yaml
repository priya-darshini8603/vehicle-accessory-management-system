$kind: http-request
url: "{{baseUrl}}/api/admin/users/{{customerId}}/role"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "role": "SUPERUSER"
    }
scripts:
  - type: afterResponse
    code: pm.test('Status is 400', () => pm.response.to.have.status(400));
    language: text/javascript
order: 5000
