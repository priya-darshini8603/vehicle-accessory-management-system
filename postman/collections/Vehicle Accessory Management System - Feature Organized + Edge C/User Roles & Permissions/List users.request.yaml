$kind: http-request
url: "{{baseUrl}}/api/admin/users?page=0&size=100"
method: GET
queryParams:
  page: "0"
  size: "100"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      const body = pm.response.json();
      const me = body.content.find(u => u.email === pm.environment.get('customerEmail'));
      pm.test('Customer is listed', () => pm.expect(me).to.exist);
      if (me) {
        pm.collectionVariables.set('customerId', me.id);
        pm.environment.set('customerId', me.id);
      }
    language: text/javascript
order: 1000
