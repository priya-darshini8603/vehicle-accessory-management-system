$kind: http-request
url: "{{baseUrl}}/api/admin/users/{{customerId}}/role"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "role": "ADMIN"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test('Role is ADMIN', () => pm.expect(body.role).to.eql('ADMIN'));
    language: text/javascript
order: 2000
