$kind: http-request
name: "Admin: price history of the accessory"
url: "{{baseUrl}}/api/admin/accessories/{{accessoryId}}/price-history"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      pm.test('Initial price recorded', () => pm.expect(pm.response.json().totalElements).to.be.at.least(1));
    language: text/javascript
order: 12000
