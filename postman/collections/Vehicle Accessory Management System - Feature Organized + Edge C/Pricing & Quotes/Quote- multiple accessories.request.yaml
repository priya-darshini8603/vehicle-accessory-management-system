$kind: http-request
name: "Quote: multiple accessories"
url: "{{baseUrl}}/api/pricing/quote"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "items": [
        { "accessoryId": {{accessoryId}}, "quantity": 1 },
        { "accessoryId": {{accessoryId2}}, "quantity": 2 }
      ]
    }
auth:
  type: bearer
  credentials:
    token: "{{customerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      const q = pm.response.json();
      pm.test('Both accessories are quoted', () => pm.expect(q.lines.map(x => x.accessoryId)).to.include.members([Number(pm.collectionVariables.get('accessoryId')), Number(pm.collectionVariables.get('accessoryId2'))]));
      pm.test('Totals reconcile', () => pm.expect(Math.round((q.subtotal - q.discountTotal + q.taxTotal) * 100)).to.eql(Math.round(q.grandTotal * 100)));
    language: text/javascript
order: 2000
