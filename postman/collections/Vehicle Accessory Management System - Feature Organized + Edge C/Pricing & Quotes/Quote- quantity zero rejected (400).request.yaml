$kind: http-request
name: "Quote: quantity zero rejected (400)"
url: "{{baseUrl}}/api/pricing/quote"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "items": [{ "accessoryId": {{accessoryId}}, "quantity": 0 }]
    }
auth:
  type: bearer
  credentials:
    token: "{{customerToken}}"
scripts:
  - type: afterResponse
    code: pm.test('Quantity zero returns 400', () => pm.response.to.have.status(400));
    language: text/javascript
order: 7000
