$kind: http-request
url: "{{baseUrl}}/api/admin/accessories/{{accessoryId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "All-Weather Floor Mats",
      "category": "Interior",
      "price": 1299.0,
      "description": "Rubber mats, set of 4 (sale)",
      "stockQuantity": 45,
      "stockAdjustmentReason": "Stock count corrected (Postman)"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test('Price and description updated', () => { pm.expect(body.price).to.eql(1299); pm.expect(body.description).to.include('sale'); });
      pm.test('Stock change recorded with its reason', () => pm.expect(body.stockQuantity).to.eql(45));
    language: text/javascript
order: 8000
