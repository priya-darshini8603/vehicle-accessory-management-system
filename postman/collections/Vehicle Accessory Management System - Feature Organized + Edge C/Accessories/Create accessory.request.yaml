$kind: http-request
url: "{{baseUrl}}/api/admin/accessories"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "All-Weather Floor Mats",
      "category": "Interior",
      "price": 1499.0,
      "description": "Rubber mats, set of 4",
      "stockQuantity": 50
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 201', () => pm.response.to.have.status(201));
      const body = pm.response.json();
      pm.test('Location header set', () => pm.response.to.have.header('Location'));
      pm.test('Fields saved', () => { pm.expect(body.name).to.eql('All-Weather Floor Mats'); pm.expect(body.price).to.eql(1499); });
      if (pm.response.code < 300) pm.collectionVariables.set('accessoryId', pm.response.json().id);
    language: text/javascript
order: 1000
