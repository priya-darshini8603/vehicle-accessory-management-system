$kind: http-request
url: "{{baseUrl}}/api/admin/accessories?page=0&size=20&sort=name,asc"
method: GET
queryParams:
  page: "0"
  size: "20"
  sort: name,asc
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test('Page envelope', () => pm.expect(body).to.include.keys('content', 'page', 'size', 'totalElements', 'totalPages'));
    language: text/javascript
order: 4000
