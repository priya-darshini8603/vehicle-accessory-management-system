$kind: http-request
url: "{{baseUrl}}/api/admin/vehicles"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "vehicleNumber": "",
      "make": "",
      "year": 1700
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 400', () => pm.response.to.have.status(400));
      const body = pm.response.json();
      pm.test('Field errors returned', () => pm.expect(body.fieldErrors).to.include.keys('vehicleNumber', 'make', 'model', 'year'));
    language: text/javascript
order: 3000
