$kind: http-request
url: "{{baseUrl}}/api/admin/vehicles"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "vehicleNumber": "  {{vehicleNumber}}  ",
      "make": "Maruti Suzuki",
      "model": "Swift",
      "year": 2022
    }
scripts:
  - type: afterResponse
    code: pm.test('Status is 409', () => pm.response.to.have.status(409));
    language: text/javascript
order: 2000
