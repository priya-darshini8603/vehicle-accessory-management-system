$kind: http-request
url: "{{baseUrl}}/api/admin/vehicles/{{vehicleId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test('Both accessories still mapped', () => pm.expect(body.accessories).to.have.lengthOf(2));
    language: text/javascript
order: 10000
