$kind: http-request
url: "{{baseUrl}}/api/auth/logout"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "refreshToken": "   "
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 400', () => pm.response.to.have.status(400));
      pm.test('Field error on refreshToken', () => pm.expect(pm.response.json().fieldErrors).to.have.property('refreshToken'));
    language: text/javascript
order: 6000
