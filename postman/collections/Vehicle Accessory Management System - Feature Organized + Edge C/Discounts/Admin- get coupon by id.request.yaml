$kind: http-request
name: "Admin: get coupon by id"
url: "{{baseUrl}}/api/admin/discounts/{{postmanCouponId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      pm.test('Returns the created coupon', () => { const d = pm.response.json(); pm.expect(d.id).to.eql(Number(pm.collectionVariables.get('postmanCouponId'))); pm.expect(d.code).to.eql(pm.collectionVariables.get('postmanCouponCode')); });
      pm.collectionVariables.set('postmanDiscountVersion', String(pm.response.json().version));
    language: text/javascript
order: 3000
