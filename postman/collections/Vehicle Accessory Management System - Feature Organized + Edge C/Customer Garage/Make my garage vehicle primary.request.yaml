$kind: http-request
url: "{{baseUrl}}/api/me/vehicles/{{garageVehicleId}}/primary"
method: PUT
auth:
  type: bearer
  credentials:
    token: "{{customerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      pm.test('Vehicle is primary', () => pm.expect(pm.response.json().primary).to.be.true);
    language: text/javascript
order: 9000
