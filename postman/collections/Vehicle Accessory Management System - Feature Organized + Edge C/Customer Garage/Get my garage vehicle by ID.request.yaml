$kind: http-request
url: "{{baseUrl}}/api/me/vehicles/{{garageVehicleId}}"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{customerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      pm.test('Returns requested vehicle', () => pm.expect(pm.response.json().id).to.eql(Number(pm.collectionVariables.get('garageVehicleId'))));
    language: text/javascript
order: 7000
