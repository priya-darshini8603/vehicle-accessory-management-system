$kind: http-request
url: "{{baseUrl}}/api/me/vehicles/{{secondVehicleId}}/accessories"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{customerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.collectionVariables.set('roofRackId', body.compatibleAccessories.find(a => a.name === 'Roof Rack').id);
    language: text/javascript
order: 3000
