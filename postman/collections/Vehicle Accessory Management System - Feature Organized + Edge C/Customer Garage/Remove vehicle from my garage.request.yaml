$kind: http-request
description: This removes the vehicle from the current customer's garage.
url: "{{baseUrl}}/api/me/vehicles/{{garageVehicleId}}"
method: DELETE
auth:
  type: bearer
  credentials:
    token: "{{customerToken}}"
scripts:
  - type: afterResponse
    code: pm.test('Status is 204', () => pm.response.to.have.status(204));
    language: text/javascript
order: 10000
