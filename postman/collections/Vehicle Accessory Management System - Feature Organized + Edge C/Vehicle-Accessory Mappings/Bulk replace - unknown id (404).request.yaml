$kind: http-request
url: "{{baseUrl}}/api/admin/vehicles/{{vehicleId}}/accessories"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "accessoryIds": [{{accessoryId}}, 999999]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 404', () => pm.response.to.have.status(404));
      pm.test('Error message', () => pm.expect(pm.response.json().message).to.eql("Accessories not found with ids [999999]"));
    language: text/javascript
order: 4000
