$kind: http-request
url: "{{baseUrl}}/api/admin/vehicles/{{vehicleId}}/accessories/{{accessoryId2}}"
method: DELETE
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test('One accessory left', () => pm.expect(body.accessories).to.have.lengthOf(1));
    language: text/javascript
order: 5000
