$kind: http-request
url: "{{baseUrl}}/api/admin/vehicles/{{vehicleId}}/accessories"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "accessoryIds": [{{accessoryId}}, {{accessoryId2}}]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test('Both accessories mapped', () => pm.expect(body.accessories).to.have.lengthOf(2));
    language: text/javascript
order: 3000
