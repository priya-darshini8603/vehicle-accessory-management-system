$kind: http-request
name: "Refresh: blank refresh token (400)"
url: "{{baseUrl}}/api/auth/refresh"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "refreshToken": "   "
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test('Blank refresh token is rejected', () => pm.response.to.have.status(400));
    language: text/javascript
order: 5000
