$kind: http-request
name: "Refresh: token exceeding max length (400)"
url: "{{baseUrl}}/api/auth/refresh"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "refreshToken": "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test('Overlong refresh token is rejected', () => pm.response.to.have.status(400));
    language: text/javascript
order: 7000
