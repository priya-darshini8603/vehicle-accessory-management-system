$kind: http-request
url: "{{baseUrl}}/api/auth/refresh"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "refreshToken": "{{customerRefreshToken}}"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test('Status is 401', () => pm.response.to.have.status(401));
    language: text/javascript
order: 3000
