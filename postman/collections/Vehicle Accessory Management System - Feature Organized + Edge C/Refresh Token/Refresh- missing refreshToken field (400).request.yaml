$kind: http-request
name: "Refresh: missing refreshToken field (400)"
url: "{{baseUrl}}/api/auth/refresh"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: "{}"
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test('Missing field is rejected', () => pm.response.to.have.status(400));
    language: text/javascript
order: 4000
