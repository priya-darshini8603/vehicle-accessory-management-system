$kind: http-request
url: "{{baseUrl}}/api/orders"
method: POST
headers:
  Content-Type: application/json
  Idempotency-Key: "{{lastOrderIdempotencyKey}}"
body:
  type: json
  content: |-
    {
      "items": [
        {
          "accessoryId": "{{accessoryId2}}",
          "quantity": 2
        }
      ]
    }
auth:
  type: bearer
  credentials:
    token: "{{customerToken}}"
scripts:
  - type: afterResponse
    code: pm.test('Conflicting idempotency payload rejected',()=>pm.response.to.have.status(409));
    language: text/javascript
order: 3000
