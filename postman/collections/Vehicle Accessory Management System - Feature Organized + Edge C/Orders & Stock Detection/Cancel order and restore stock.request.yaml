$kind: http-request
url: "{{baseUrl}}/api/orders/{{orderId}}/cancel"
method: POST
auth:
  type: bearer
  credentials:
    token: "{{customerToken}}"
scripts:
  - type: afterResponse
    code: pm.test('Order cancellation succeeds',()=>pm.response.to.have.status(200));
    language: text/javascript
order: 10000
