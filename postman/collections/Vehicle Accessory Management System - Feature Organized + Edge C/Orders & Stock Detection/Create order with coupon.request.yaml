$kind: http-request
url: "{{baseUrl}}/api/orders"
method: POST
headers:
  Content-Type: application/json
  Idempotency-Key: "{{lastOrderIdempotencyKey}}"
body:
  type: json
  content: |-
    {
      "items": [
        {
          "accessoryId": {{accessoryId}},
          "quantity": 1
        }
      ],
      "couponCode": "{{postmanCouponCode}}"
    }
auth:
  type: bearer
  credentials:
    token: "{{customerToken}}"
scripts:
  - type: beforeRequest
    code: pm.request.headers.upsert({key:'Idempotency-Key', value:'order-' + Date.now() + '-' + Math.random().toString(16).slice(2)});
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Order creation returns 201', () => pm.response.to.have.status(201));
      if (pm.response.code === 201) { const b = pm.response.json(); if (b.id !== undefined) { pm.collectionVariables.set('createdOrderId', b.id); pm.collectionVariables.set('orderId', b.id); } }
    language: text/javascript
order: 5000
