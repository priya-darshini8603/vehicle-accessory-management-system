$kind: http-request
url: "{{baseUrl}}/api/compatibility?vehicleNumber= "
method: GET
queryParams:
  vehicleNumber: " "
auth:
  type: bearer
  credentials:
    token: "{{customerToken}}"
scripts:
  - type: afterResponse
    code: pm.test('Status is 400', () => pm.response.to.have.status(400));
    language: text/javascript
order: 5000
