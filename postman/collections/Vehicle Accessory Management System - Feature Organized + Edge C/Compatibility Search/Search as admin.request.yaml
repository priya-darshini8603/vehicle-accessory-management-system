$kind: http-request
url: "{{baseUrl}}/api/compatibility?vehicleNumber={{vehicleNumber}}"
method: GET
queryParams:
  vehicleNumber: "{{vehicleNumber}}"
scripts:
  - type: afterResponse
    code: pm.test('Status is 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 3000
