$kind: http-request
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{customerEmail}}",
      "password": "{{customerPassword}}"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test('User is CUSTOMER', () => pm.expect(body.user.role).to.eql('CUSTOMER'));
      if (pm.response.code < 300) {
        pm.collectionVariables.set('customerToken', body.accessToken);
        pm.collectionVariables.set('customerId', body.user.id);
        pm.collectionVariables.set('customerRefreshToken', body.refreshToken);
        pm.environment.set('customerToken', body.accessToken);
        pm.environment.set('customerId', body.user.id);
        pm.environment.set('customerRefreshToken', body.refreshToken);
      }
    language: text/javascript
order: 3000
