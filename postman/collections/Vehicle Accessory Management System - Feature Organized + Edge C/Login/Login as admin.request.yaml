$kind: http-request
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{adminEmail}}",
      "password": "{{adminPassword}}"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test('Bearer token issued', () => { pm.expect(body.tokenType).to.eql('Bearer'); pm.expect(body.accessToken).to.be.a('string'); });
      pm.test('User is ADMIN', () => pm.expect(body.user.role).to.eql('ADMIN'));
      if (pm.response.code < 300) {
        pm.collectionVariables.set('adminToken', body.accessToken);
        pm.collectionVariables.set('adminRefreshToken', body.refreshToken);
        pm.environment.set('adminToken', body.accessToken);
        pm.environment.set('adminRefreshToken', body.refreshToken);
      }
    language: text/javascript
order: 2000
