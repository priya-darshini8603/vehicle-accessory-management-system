spring.application.name=vehicle-accessory-management-system

server.port=${PORT:8080}

# --- Database (PostgreSQL) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/vams_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
# Flyway owns the schema (src/main/resources/db/migration); Hibernate only checks that the entities match it.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.flyway.enabled=true
# A database that already has tables but no Flyway history (created earlier by ddl-auto=update) is marked as
# V1 instead of re-running the baseline; later migrations then apply normally.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# N+1 safety net: when a lazy association is touched in a loop anyway, Hibernate loads it for up to
# 50 parents in one IN (...) query instead of one query per parent. Hot paths still use fetch joins.
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# --- JWT ---
# Base64-encoded HMAC secret, at least 32 bytes decoded: openssl rand -base64 48
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:1800000}

# --- Refresh tokens ---
# Absolute session lifetime (30 days). Rotation does NOT extend it.
app.refresh-token.expiration-ms=${REFRESH_TOKEN_EXPIRATION_MS:2592000000}
# A spent token presented again within this window is rejected as a retry.
# Outside it, all active refresh tokens of that user are revoked.
app.refresh-token.reuse-grace-ms=${REFRESH_TOKEN_REUSE_GRACE_MS:5000}
# Daily purge of tokens revoked/expired for more than the retention period.
app.refresh-token.cleanup-cron=${REFRESH_TOKEN_CLEANUP_CRON:0 30 3 * * *}
app.refresh-token.cleanup-retention-days=${REFRESH_TOKEN_CLEANUP_RETENTION_DAYS:7}

# --- Bootstrap administrator (created on startup if the email does not exist yet) ---
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.full-name=${ADMIN_FULL_NAME:System Administrator}

# --- Pricing ---
# GST percent applied when an accessory has no tax rate of its own
app.pricing.default-tax-rate=${DEFAULT_TAX_RATE:18.00}

# --- Customer garage ---
app.garage.max-vehicles-per-customer=${MAX_VEHICLES_PER_CUSTOMER:10}

# --- Paging ---
spring.data.web.pageable.max-page-size=100

# --- Inventory analysis ---
app.inventory.analysis-cron=${INVENTORY_ANALYSIS_CRON:0 0 0 * * *}
app.inventory.analysis-time-zone=${INVENTORY_ANALYSIS_TIME_ZONE:UTC}

# --- Logging ---
logging.level.root=INFO
logging.level.org.example=INFO

spring.profiles.active=dev

spring.flyway.clean-disabled=false
spring.flyway.clean-on-validation-error=true