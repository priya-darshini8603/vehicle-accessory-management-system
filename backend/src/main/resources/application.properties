spring.application.name=vehicle-accessory-management-system

# Local development defaults live in application-dev.properties and apply when no profile is
# activated. In any other environment set SPRING_PROFILES_ACTIVE=prod and supply the variables below.
spring.profiles.default=dev

server.port=${PORT:8080}

# --- Database (PostgreSQL) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/vams_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# --- JWT ---
# Base64-encoded HMAC secret, at least 32 bytes decoded: openssl rand -base64 48
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:1800000}
app.refresh-token.expiration-ms=${REFRESH_TOKEN_EXPIRATION_MS:2592000000}

# --- Bootstrap administrator (created on startup if the email does not exist yet) ---
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.full-name=${ADMIN_FULL_NAME:System Administrator}

# --- Paging ---
spring.data.web.pageable.max-page-size=100

# --- Logging ---
logging.level.root=INFO
logging.level.org.example=INFO
