# Local development profile. Activate it explicitly: ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev
#
# No secrets live in this file (it is committed). The JWT secret and the bootstrap admin come from
# backend/.env, which is git-ignored; copy .env.example to .env and fill it in. Real environment
# variables override values from .env.
spring.config.import=optional:file:.env[.properties]

# Matches the local docker-compose PostgreSQL; never reuse it elsewhere.
spring.datasource.password=${DB_PASSWORD:admin}

app.jwt.secret=${JWT_SECRET:}

app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# Demo catalog for presentations (DemoDataSeeder); only seeds an empty database.
app.demo.seed=${DEMO_SEED:false}
app.demo.customer-password=${DEMO_CUSTOMER_PASSWORD:}

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

logging.level.org.example=DEBUG
logging.level.org.springframework.security=DEBUG
