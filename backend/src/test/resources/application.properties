spring.application.name=vehicle-accessory-management-system-test

# In-memory H2 emulating PostgreSQL; YEAR is reserved in H2 but is a valid column name in PostgreSQL
spring.datasource.url=jdbc:h2:mem:vams_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;NON_KEYWORDS=YEAR,VALUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50
# QueryCountTest reads Hibernate statistics to prove hot paths run a fixed number of queries
spring.jpa.properties.hibernate.generate_statistics=true
logging.level.org.hibernate.engine.internal.StatisticalLoggingSessionEventListener=WARN

logging.level.root=WARN
logging.level.org.example=INFO

spring.data.web.pageable.max-page-size=100

# Test-only signing key and bootstrap admin
app.jwt.secret=dGVzdC1vbmx5LWp3dC1zZWNyZXQta2V5LWZvci1oczI1Ni0zMi1ieXRlcyEhIQ==
app.jwt.expiration-ms=600000
app.refresh-token.expiration-ms=2592000000
app.admin.email=admin@test.local
app.admin.password=AdminPassword123!

app.pricing.default-tax-rate=18.00
app.garage.max-vehicles-per-customer=3
