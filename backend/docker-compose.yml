# Local PostgreSQL matching the dev profile defaults (application-dev.properties).
services:
  postgres:
    image: postgres:16-alpine
    container_name: vams-postgres
    environment:
      POSTGRES_DB: vams_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - vams-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vams_db"]
      interval: 5s
      retries: 10

volumes:
  vams-pgdata:
