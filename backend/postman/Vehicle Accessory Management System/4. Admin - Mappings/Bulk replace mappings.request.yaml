$kind: http-request
url: "{{baseUrl}}/api/admin/vehicles/{{vehicleId}}/accessories"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "accessoryIds": [
        {{accessoryId}},
        {{accessoryId2}}
      ]
    }
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: pm.test('Status is 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 2000
