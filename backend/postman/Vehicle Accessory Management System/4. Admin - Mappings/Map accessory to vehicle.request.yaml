$kind: http-request
url: "{{baseUrl}}/api/admin/vehicles/{{vehicleId}}/accessories/{{accessoryId}}"
method: POST
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: pm.test('Status is 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 1000
