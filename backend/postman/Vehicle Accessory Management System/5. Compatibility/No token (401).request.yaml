$kind: http-request
url: "{{baseUrl}}/api/compatibility?vehicleNumber={{vehicleNumber}}"
method: GET
queryParams:
  vehicleNumber: "{{vehicleNumber}}"
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test('Status is 401', () => pm.response.to.have.status(401));
    language: text/javascript
order: 4000
