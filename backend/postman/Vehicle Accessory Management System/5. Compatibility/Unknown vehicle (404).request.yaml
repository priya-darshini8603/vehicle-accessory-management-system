$kind: http-request
url: "{{baseUrl}}/api/compatibility/vehicles/ZZ00ZZ0000/accessories"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{customerToken}}"
scripts:
  - type: afterResponse
    code: pm.test('Status is 404', () => pm.response.to.have.status(404));
    language: text/javascript
order: 3000
