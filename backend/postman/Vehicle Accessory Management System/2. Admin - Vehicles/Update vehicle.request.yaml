$kind: http-request
url: "{{baseUrl}}/api/admin/vehicles/{{vehicleId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "vehicleNumber": "KA01AB1234",
      "make": "Maruti Suzuki",
      "model": "Swift ZXi",
      "year": 2023
    }
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: pm.test('Status is 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 6000
