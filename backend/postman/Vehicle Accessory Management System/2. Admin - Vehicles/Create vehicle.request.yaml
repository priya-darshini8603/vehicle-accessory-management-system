$kind: http-request
url: "{{baseUrl}}/api/admin/vehicles"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "vehicleNumber": "KA01AB1234",
      "make": "Maruti Suzuki",
      "model": "Swift",
      "year": 2022
    }
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 201', () => pm.response.to.have.status(201));
      if (pm.response.code < 300) pm.collectionVariables.set('vehicleId', pm.response.json().id);
    language: text/javascript
order: 1000
