$kind: http-request
url: "{{baseUrl}}/api/admin/vehicles?page=0&size=20&sort=vehicleNumber,asc"
method: GET
queryParams:
  page: "0"
  size: "20"
  sort: vehicleNumber,asc
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: pm.test('Status is 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 4000
