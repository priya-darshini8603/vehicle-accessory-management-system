$kind: http-request
url: "{{baseUrl}}/api/admin/accessories/{{accessoryId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "All-Weather Floor Mats",
      "category": "Interior",
      "price": 1299.0,
      "description": "Rubber mats, set of 4 (sale)",
      "stockQuantity": 45
    }
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: pm.test('Status is 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 5000
