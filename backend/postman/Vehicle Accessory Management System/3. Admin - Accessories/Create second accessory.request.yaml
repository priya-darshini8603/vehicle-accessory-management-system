$kind: http-request
url: "{{baseUrl}}/api/admin/accessories"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Roof Rack",
      "category": "Exterior",
      "price": 8999.5,
      "description": "Aluminium cross bars"
    }
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 201', () => pm.response.to.have.status(201));
      if (pm.response.code < 300) pm.collectionVariables.set('accessoryId2', pm.response.json().id);
    language: text/javascript
order: 2000
