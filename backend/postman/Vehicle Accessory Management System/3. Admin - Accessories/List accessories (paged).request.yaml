$kind: http-request
url: "{{baseUrl}}/api/admin/accessories?page=0&size=20&sort=name,asc"
method: GET
queryParams:
  page: "0"
  size: "20"
  sort: name,asc
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: pm.test('Status is 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 3000
